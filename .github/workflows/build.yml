name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q MyDigi-Android-Calculator-source.zip

      - name: Build APK
        run: gradle -p MyDigiAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyDigi-Calculator-APK
          path: MyDigiAndroid/app/build/outputs/apk/debug/app-debug.apk
